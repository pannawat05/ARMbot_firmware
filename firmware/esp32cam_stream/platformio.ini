; ESP32-CAM serial stream for python/pick_and_place.py SerialCamera.
; STREAM_BAUD must match camera.baud in calibration/pick_place_config.json.
[env:esp32cam]
platform = espressif32
board = esp32cam
framework = arduino
upload_port = /dev/serial/by-id/usb-1a86_USB_Serial-if00-port0
upload_speed = 460800
build_flags =
    -DSTREAM_BAUD=460800
    -DSTREAM_QUALITY=12
